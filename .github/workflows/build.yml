name: Build Headless Packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Pack Core, MCP, and CLI
        run: npm pack --workspace=@llm-wiki/core --workspace=@llm-wiki/mcp-server --workspace=@llm-wiki/cli
      - uses: actions/upload-artifact@v4
        with:
          name: llm-wiki-headless-packages
          path: "*.tgz"
